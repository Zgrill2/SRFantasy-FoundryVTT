services:
  foundry:
    image: felddy/foundryvtt:14
    init: true
    restart: unless-stopped
    ports:
      - "30000:30000/tcp"
    volumes:
      # Foundry's user data (worlds, modules, saves). Gitignored.
      - ./.foundry-data:/data
      # The built system, mounted straight in. `npm run watch` rewrites this live.
      # NOTE: run `npm run build` once before the first `docker compose up`, or Docker
      # will create dist/ as a root-owned empty directory and you'll fight permissions.
      - ./dist:/data/Data/systems/shimmeringreach
    environment:
      FOUNDRY_USERNAME: ${FOUNDRY_USERNAME}
      FOUNDRY_PASSWORD: ${FOUNDRY_PASSWORD}
      FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_KEY}
      FOUNDRY_ADMIN_KEY: ${FOUNDRY_ADMIN_KEY:-dev}
      CONTAINER_CACHE: /data/container_cache
